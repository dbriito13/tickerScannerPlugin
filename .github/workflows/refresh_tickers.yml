name: Refresh All Tickers

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of every month at 6:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh all existing tickers
        run: python scripts/update_tickers.py --refresh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickers.js exclusions.js
          git diff --staged --quiet || git commit -m "chore: refresh ticker data"
          git push
